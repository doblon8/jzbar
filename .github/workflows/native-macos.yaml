name: "Native: macOS"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: macos-15-intel, lipo_arch: x86_64 }
          - { arch: aarch64, runner: macos-15, lipo_arch: arm64 }
    defaults:
      run:
        shell: bash
    env:
      EXPECT_ARCH: ${{ matrix.lipo_arch }}

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build
        run: bash native/build-macos.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: dist/libzbar.dylib