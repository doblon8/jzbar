name: "Native: Linux"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Ubuntu 20.04 (glibc 2.31, GCC 9.4) keeps the binary loadable on older distros.
    # Pinned to the multi-arch index digest (image built 2025-04-04).
    container: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl bzip2 pkg-config git

      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Load pinned sources
        run: grep -E '^[A-Z0-9_]+=' native/sources.env | tr -d '\r' >> "$GITHUB_ENV"

      - name: Toolchain versions
        run: |
          uname -m
          gcc --version | sed -n 1p
          ld --version | sed -n 1p
          ldd --version | sed -n 1p
          dpkg-query -W gcc-9 binutils libc6 libc6-dev make

      - name: Fetch and verify ZBar source
        run: |
          : "${ZBAR_VERSION:?}" "${ZBAR_SHA256:?}"
          mkdir -p /tmp/src && cd /tmp/src
          curl -fsSLo zbar.tar.bz2 "https://linuxtv.org/downloads/zbar/zbar-$ZBAR_VERSION.tar.bz2"
          echo "$ZBAR_SHA256  zbar.tar.bz2" | sha256sum -c -
          tar xjf zbar.tar.bz2

      # No libiconv here: glibc provides iconv itself.
      - name: Build ZBar (library only, no video)
        run: |
          cd /tmp/src/zbar-$ZBAR_VERSION
          ./configure --enable-shared --disable-static \
                      --disable-video --disable-doc --disable-nls \
                      --without-jpeg --without-imagemagick --without-graphicsmagick \
                      --without-python --without-gtk --without-gir \
                      --without-qt --without-qt6 --without-java \
                      --without-xshm --without-xv --without-dbus --without-npapi \
                      --without-x \
                      CFLAGS="-O2" LDFLAGS="-static-libgcc"
          make -C zbar -j"$(nproc)"

      - name: Collect and verify
        run: |
          export LC_ALL=C
          mkdir -p dist
          cp -L /tmp/src/zbar-$ZBAR_VERSION/zbar/.libs/libzbar.so dist/libzbar.so
          strip --strip-unneeded dist/libzbar.so
          cd dist

          # only glibc components may be needed (libc, libm, libpthread, libdl, librt, loader)
          bad=$(readelf -d libzbar.so | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/' \
                | grep -vE '^(libc\.so\.6|libm\.so\.6|libpthread\.so\.0|libdl\.so\.2|librt\.so\.1|ld-linux-(x86-64|aarch64)\.so\.[12])$' || true)
          if [ -n "$bad" ]; then echo "FAIL: unexpected dependencies:"; echo "$bad"; exit 1; fi

          # an RPATH/RUNPATH would embed a build path
          if readelf -d libzbar.so | grep -E 'RPATH|RUNPATH'; then
            echo "FAIL: RPATH/RUNPATH present"; exit 1
          fi

          # key API must be exported
          exports=$(nm -D --defined-only libzbar.so)
          for sym in zbar_version zbar_image_scanner_create; do
            grep -qE " T $sym\$" <<<"$exports" || { echo "FAIL: missing export $sym"; exit 1; }
          done

          # no build paths or usernames
          if strings -a libzbar.so | grep -E '/home/|/tmp/|/root/|/__w/|/github/|runner'; then
            echo "FAIL: build path or username found in binary"; exit 1
          fi

          echo "Highest glibc symbol version required: $(objdump -T libzbar.so | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
          sha256sum libzbar.so

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/libzbar.so