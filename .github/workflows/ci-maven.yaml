name: Build with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up JDK 25
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: maven

    - name: Build with Maven
      run: mvn -B package

  native-manifest:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up JDK 25
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'temurin'
        java-version: '25'

    - name: Check native files against manifests
      run: bash native/check-manifests.sh

    - name: Check THIRD-PARTY-NOTICES is up to date
      run: bash native/make-notices.sh && git diff --exit-code -- THIRD-PARTY-NOTICES

    - name: Check the source offer matches the release version
      run: |
        url=$(sed -n 's/^SOURCE_BUNDLE_URL=//p' native/sources.env)
        ver=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
        expected="https://github.com/doblon8/jzbar/releases/download/v$ver/jzbar-native-sources-$ver.tar.gz"
        [ "$url" = "$expected" ] || { echo "FAIL: SOURCE_BUNDLE_URL is '$url', expected '$expected'" >&2; exit 1; }

  source-bundle:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - run: bash native/make-source-bundle.sh ci "$RUNNER_TEMP/bundle"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: source-bundle
        path: ${{ runner.temp }}/bundle/jzbar-native-sources-ci.tar.gz
        retention-days: 1

  native-rebuild-linux:
    name: native-rebuild-linux (${{ matrix.arch }})
    needs: source-bundle
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: source-bundle
        path: ${{ runner.temp }}

    - name: Unpack the source bundle
      run: tar -xzf "$RUNNER_TEMP/jzbar-native-sources-ci.tar.gz" -C "$RUNNER_TEMP"

    - name: Rebuild libzbar.so from the bundle
      run: |
        docker run --rm \
          -v "$RUNNER_TEMP/jzbar-native-sources-ci:/src" -w /src \
          -e NATIVE_SOURCES_DIR=/src/sources -e DEBIAN_FRONTEND=noninteractive \
          ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214 \
          bash -ec '
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential ca-certificates curl pkg-config python3-pip ninja-build
            native/build-linux.sh /src/out'

    - name: Compare with the committed binary
      run: cmp "$RUNNER_TEMP/jzbar-native-sources-ci/out/libzbar.so" "src/main/resources/native/linux/${{ matrix.arch }}/libzbar.so"

    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: maven

    - name: Test with the rebuilt library as a user-supplied one
      run: >
        mvn -B test
        -Djzbar.test.libdir="$RUNNER_TEMP/jzbar-native-sources-ci/out"
        -Djzbar.test.requireUserLib=true

  native-rebuild-macos:
    name: native-rebuild-macos (${{ matrix.arch }})
    needs: source-bundle
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: macos-15-intel, lipo_arch: x86_64 }
          - { arch: aarch64, runner: macos-15, lipo_arch: arm64 }
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: source-bundle
        path: ${{ runner.temp }}

    - name: Unpack the source bundle
      run: tar -xzf "$RUNNER_TEMP/jzbar-native-sources-ci.tar.gz" -C "$RUNNER_TEMP"

    - name: Rebuild libzbar.dylib from the bundle
      env:
        EXPECT_ARCH: ${{ matrix.lipo_arch }}
      run: |
        cd "$RUNNER_TEMP/jzbar-native-sources-ci"
        NATIVE_SOURCES_DIR="$PWD/sources" bash native/build-macos.sh "$PWD/out"

    - name: Compare with the committed binary
      run: |
        out="$RUNNER_TEMP/jzbar-native-sources-ci/out"
        manifest="native/manifest/macos-${{ matrix.arch }}.manifest"
        grep '^tool\.' "$manifest" | LC_ALL=C sort > "$RUNNER_TEMP/tools.expected"
        grep '^tool\.' "$out/toolchain.txt" | LC_ALL=C sort > "$RUNNER_TEMP/tools.actual"
        if diff "$RUNNER_TEMP/tools.expected" "$RUNNER_TEMP/tools.actual"; then
          cmp "$out/libzbar.dylib" "src/main/resources/native/osx/${{ matrix.arch }}/libzbar.dylib"
        else
          echo "::warning::Runner toolchain differs from the manifest; skipping the binary comparison"
        fi

    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: maven

    - name: Test with the rebuilt library as a user-supplied one
      run: >
        mvn -B test
        -Djzbar.test.libdir="$RUNNER_TEMP/jzbar-native-sources-ci/out"
        -Djzbar.test.requireUserLib=true

  native-rebuild-windows:
    needs: source-bundle
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: source-bundle
        path: ${{ runner.temp }}

    - name: Unpack the source bundle
      shell: bash
      run: |
        tmp=$(cygpath -u "$RUNNER_TEMP")
        tar -xzf "$tmp/jzbar-native-sources-ci.tar.gz" -C "$tmp"

    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        msystem: UCRT64
        update: false
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-pkgconf
          make
          curl

    - name: Rebuild the DLLs from the bundle
      shell: msys2 {0}
      run: |
        cd "$(cygpath -u "$RUNNER_TEMP")/jzbar-native-sources-ci"
        NATIVE_SOURCES_DIR="$PWD/sources" bash native/build-windows-x64.sh "$PWD/out"

    - name: Compare with the committed DLLs
      shell: bash
      run: |
        out="$RUNNER_TEMP/jzbar-native-sources-ci/out"
        manifest=native/manifest/windows-x64.manifest
        pattern='^(tool|static|notice)\.'
        # tr: a Windows checkout may have CRLF line endings
        tr -d '\r' < "$manifest" | grep -E "$pattern" | LC_ALL=C sort > "$RUNNER_TEMP/tools.expected"
        tr -d '\r' < "$out/toolchain.txt" | grep -E "$pattern" | LC_ALL=C sort > "$RUNNER_TEMP/tools.actual"
        if diff "$RUNNER_TEMP/tools.expected" "$RUNNER_TEMP/tools.actual"; then
          for f in zbar.dll libiconv-2.dll; do
            cmp "$out/$f" "src/main/resources/native/windows/x64/$f"
          done
        else
          echo "::warning::Runner toolchain differs from the manifest; skipping the binary comparison"
        fi

    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: maven

    - name: Test with the rebuilt DLLs as user-supplied libraries
      shell: bash
      run: >
        mvn -B test
        -Djzbar.test.libdir="$(cygpath -w "$RUNNER_TEMP/jzbar-native-sources-ci/out")"
        -Djzbar.test.requireUserLib=true